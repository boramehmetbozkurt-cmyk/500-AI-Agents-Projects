name: OSIRIS AI Fusion Security

on:
  pull_request:
    paths:
      - "osiris_ai_fusion/**"
      - ".github/workflows/osiris-ai-fusion-security.yml"
  push:
    branches: [main, osiris-fusion-v1-release]
    paths:
      - "osiris_ai_fusion/**"
      - ".github/workflows/osiris-ai-fusion-security.yml"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osiris_ai_fusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened container
        run: docker build --pull -t osiris-ai-fusion:ci osiris_ai_fusion
      - name: Inspect non-root runtime user
        run: docker run --rm --entrypoint sh osiris-ai-fusion:ci -c 'test "$(id -u)" = "10001"'
