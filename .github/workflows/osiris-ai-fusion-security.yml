name: OSIRIS AI Fusion Security

on:
  pull_request:
    paths:
      - "osiris_ai_fusion/**"
      - ".github/workflows/osiris-ai-fusion-security.yml"
  push:
    branches:
      - main
      - osiris-fusion-v1-release
      - osiris-fusion-universal-capabilities
      - osiris-fusion-provider-federation
      - osiris-fusion-public-saas
    paths:
      - "osiris_ai_fusion/**"
      - ".github/workflows/osiris-ai-fusion-security.yml"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osiris_ai_fusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: Scan repository for credential-like material
        run: python scripts/scan_secrets.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened container
        run: docker build --pull -t osiris-ai-fusion:ci osiris_ai_fusion
      - name: Inspect non-root runtime user
        run: docker run --rm --entrypoint sh osiris-ai-fusion:ci -c 'test "$(id -u)" = "10001"'
      - name: Validate production Compose security baseline
        working-directory: osiris_ai_fusion
        run: |
          cat > .env.production <<'EOF'
          SAAS_BASE_URL=https://example.invalid
          CORS_ORIGINS=https://example.invalid
          REQUIRE_SIGNED_RECEIPTS=false
          WATCHER_ENABLED=false
          EOF
          docker compose -f docker-compose.production.yml config > /tmp/osiris-compose.yml
          grep -q 'read_only: true' /tmp/osiris-compose.yml
          grep -q 'no-new-privileges:true' /tmp/osiris-compose.yml
          grep -q 'cap_drop:' /tmp/osiris-compose.yml
          rm -f .env.production
