name: Deploy OSIRIS Fusion Demo to GitHub Pages

# GitHub Pages is not yet enabled for this repository and the connected GitHub
# integration cannot change that repository-level setting. Keep deployment
# available for manual use after Pages is enabled, but never auto-run and send
# false failure notifications on normal OSIRIS changes.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "osiris-fusion-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify demo files
        run: |
          test -f osiris_ai_fusion/demo/index.html
          test -f osiris_ai_fusion/demo/app.js
          test -f osiris_ai_fusion/demo/styles.css

      - name: Upload OSIRIS Fusion demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: osiris_ai_fusion/demo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
