name: Wallet Hunter CI

on:
  push:
    branches: [wallet-hunter-standalone]
    paths:
      - "wallet_hunter/**"
      - ".github/workflows/wallet-hunter-ci.yml"
  pull_request:
    paths:
      - "wallet_hunter/**"
      - ".github/workflows/wallet-hunter-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet_hunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall wallet_hunter
      - name: Ruff
        run: ruff check wallet_hunter tests
      - name: Pytest
        run: pytest -q
