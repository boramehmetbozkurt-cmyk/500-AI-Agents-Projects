name: ORBYTHRA Strategic AI Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orbythra-strategic-ai-validation.yml"
      - "osiris_ai_fusion/benchmarks/strategic_ai_validation_v1.json"
      - "osiris_ai_fusion/run_browser_strategic_validation.py"
      - "osiris_ai_fusion/run_adaptive_benchmark.py"
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read

concurrency:
  group: orbythra-strategic-ai-validation-v2
  cancel-in-progress: true

jobs:
  strategic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORBYTHRA_BENCHMARK_BASE_URL: "https://orbythra-adaptive-core-llftzg.v2.appdeploy.ai"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: |
          python -m pip install "httpx>=0.27,<1.0" "playwright>=1.49,<2.0"
          python -m playwright install --with-deps chromium

      - name: Create evidence directory
        run: mkdir -p dist/strategic-ai-validation

      - name: Run live browser strategic validation
        id: benchmark
        working-directory: osiris_ai_fusion
        continue-on-error: true
        run: |
          set +e
          python run_browser_strategic_validation.py \
            --base-url "$ORBYTHRA_BENCHMARK_BASE_URL" \
            --suite benchmarks/strategic_ai_validation_v1.json \
            --timeout 90 \
            --concurrency 1 \
            --output ../dist/strategic-ai-validation/result.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write auditable summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path("dist/strategic-ai-validation/result.json")
          out = Path("dist/strategic-ai-validation/SUMMARY.md")
          if not result_path.exists():
              out.write_text(
                  "# ORBYTHRA Strategic AI Validation\n\n"
                  "The live browser benchmark did not produce a result file. No capability claim is authorized.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)
          r = json.loads(result_path.read_text(encoding="utf-8"))
          passed = bool(r.get("suite_passed"))
          blocked = bool(r.get("budget_blocked"))
          overall = r.get("overall_score")
          overall_text = "N/A (platform budget blocked)" if overall is None else f"{float(overall):.3f}"
          lines = [
              "# ORBYTHRA Strategic AI Validation",
              "",
              f"- Suite: `{r.get('suite')}`",
              f"- Transport: `{r.get('transport')}`",
              f"- Live app: `{r.get('base_url')}{r.get('browser_entry')}`",
              f"- Capability-test concurrency: **{r.get('concurrency')}**",
              f"- Executed requests: **{r.get('executed_cases')}**",
              f"- Scored cases: **{r.get('scored_cases')}**",
              f"- Skipped after block: **{r.get('skipped_cases')}**",
              f"- Passed scored cases: **{r.get('passed_cases')}**",
              f"- Pass rate over scored cases: **{float(r.get('pass_rate', 0))*100:.1f}%**",
              f"- Overall score: **{overall_text}**",
              f"- Minimum required score: **{float(r.get('minimum_overall_score', 0)):.2f}**",
              f"- Median executed-request latency: **{r.get('median_latency_ms')} ms**",
              f"- Platform budget blocked: **{str(blocked).upper()}**",
              f"- Suite passed: **{str(passed).upper()}**",
              "",
              "## Claim boundary",
              "",
              "This is a single-session capability benchmark. Concurrent-load and SLO evidence are measured separately by the production evidence/resilience workflows. A platform token-budget block is not converted into a zero model-quality score, and it still prevents a pass claim.",
              str(r.get("claim_boundary") or "First-party production benchmark only."),
              "",
              "## Cases",
              "",
          ]
          for case in r.get("results", []):
              if case.get("skipped"):
                  status = "BLOCKED/SKIPPED"
              elif case.get("blocked"):
                  status = "BUDGET BLOCKED"
              else:
                  status = "PASS" if case.get("passed") else "FAIL"
              lines.append(
                  f"- `{case.get('id')}` — **{status}**, score={case.get('score')}, latency={case.get('latency_ms')} ms"
              )
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")

          github_summary = os.getenv("GITHUB_STEP_SUMMARY")
          if github_summary:
              Path(github_summary).write_text(out.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Upload strategic validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbythra-strategic-ai-validation-${{ github.run_id }}
          path: dist/strategic-ai-validation
          retention-days: 90

      - name: Enforce benchmark gate
        if: always()
        run: |
          test "${{ steps.benchmark.outputs.exit_code }}" = "0"
