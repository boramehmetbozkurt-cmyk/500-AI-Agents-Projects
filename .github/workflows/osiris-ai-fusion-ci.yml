name: OSIRIS AI Fusion CI

on:
  pull_request:
    paths:
      - "osiris_ai_fusion/**"
      - ".github/workflows/osiris-ai-fusion-ci.yml"
  push:
    branches:
      - main
      - osiris-ai-fusion-production
      - osiris-fusion-v1-release
      - osiris-fusion-universal-capabilities
      - osiris-fusion-provider-federation
      - osiris-fusion-public-saas
    paths:
      - "osiris_ai_fusion/**"
      - ".github/workflows/osiris-ai-fusion-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osiris_ai_fusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            osiris_ai_fusion/requirements.txt
            osiris_ai_fusion/requirements-dev.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q .
      - name: Validate browser JavaScript
        run: |
          node --check ui/assets/app.js
          node --check ui/assets/atlas.js
          node --check ui/assets/temporal-globe.js
          node --check saas_ui/assets/app.js
      - name: Import application
        env:
          UI_ENABLED: "true"
          SAAS_ENABLED: "true"
          AI_PLANNER_ENABLED: "false"
        run: python -c "import app; assert app.app.version == '1.3.0'"
