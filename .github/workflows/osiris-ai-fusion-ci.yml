name: OSIRIS AI Fusion CI

on:
  pull_request:
    paths:
      - "osiris_ai_fusion/**"
      - ".github/workflows/osiris-ai-fusion-ci.yml"
  push:
    branches: [main, osiris-ai-fusion-production]
    paths:
      - "osiris_ai_fusion/**"
      - ".github/workflows/osiris-ai-fusion-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osiris_ai_fusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: osiris_ai_fusion/requirements-dev.txt
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q .
