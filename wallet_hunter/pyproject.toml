[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-hunter"
version = "0.1.0"
description = "Read-only EVM wallet intelligence and airdrop discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
wallet-hunter = "wallet_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wallet_hunter*"]

[tool.ruff]
line-length = 100
