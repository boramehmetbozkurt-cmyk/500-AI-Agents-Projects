name: ORBYTHRA V19 Structured Planner Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v19-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      ORBYTHRA_ENV: test
      ORBYTHRA_API_KEYS: ci:ci-test-key
      ORBYTHRA_API_ROLES: ci=admin
      ORBYTHRA_DB_PATH: /tmp/orbythra-v19-ci.db
      ORBYTHRA_RATE_LIMIT_PER_MINUTE: 1000
      ORBYTHRA_MASTER_KEYS: ci-v19:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      ORBYTHRA_RELEASE_SHA: \${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements.lock
      - name: Compile V19 modules
        run: python -m py_compile app/planner_synthesis_v19.py app/planner_reflection_v19.py app/api.py
      - name: V19 structured planner regression suite
        run: pytest -q tests/test_structured_planner_v19.py
      - name: V19 production OpenAPI composition gate
        run: |
          python - <<'PYTHON'
          from app.api import app
          paths=set(app.openapi()["paths"])
          required={
              "/v19/planner/synthesize",
              "/v19/planner/proposals/{proposal_id}",
              "/v19/planner/proposals/{proposal_id}/apply",
              "/v19/reflection/assess",
              "/v19/reflection/readiness",
          }
          missing=sorted(required-paths)
          assert not missing, missing
          print("V19 OpenAPI composition passed")
          PYTHON
      - name: V19 authority and AGI claim-boundary gate
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          text=Path("app/planner_reflection_v19.py").read_text(encoding="utf-8")
          assert '"automatic_tool_execution": False' in text
          assert '"permission_self_escalation": False' in text
          assert '"live_agi_claim": False' in text
          assert "not proof of AGI" in text
          print("V19 authority boundary passed")
          PYTHON
