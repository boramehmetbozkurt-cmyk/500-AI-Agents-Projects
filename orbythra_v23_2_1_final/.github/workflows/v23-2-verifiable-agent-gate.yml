name: ORBYTHRA V23.2 Verifiable Agent Traceability Gate

on:
  push:
    branches:
      - v23.2-verifiable-agent
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  v23-2-verifiable-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      ORBYTHRA_ENV: test
      ORBYTHRA_API_KEYS: tester:test-secret
      ORBYTHRA_API_ROLES: tester=admin
      ORBYTHRA_DB_PATH: /tmp/orbythra-v232-ci.db
      ORBYTHRA_MASTER_KEYS: v232-ci:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      ORBYTHRA_SIGNING_KEYS: v232-sign:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
      ORBYTHRA_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements.lock
      - name: Compile V23.2
        run: python -m compileall -q app/verifiable_general_agent_v23.py app/verifiable_general_agent_v232.py tests/test_v23_2_verifiable_agent.py app/api.py
      - name: V23/V23.1/V23.2 focused regression
        run: pytest -q tests/test_v23_verifiable_general_agent.py tests/test_v23_1_search_and_attachments.py tests/test_v23_2_verifiable_agent.py
      - name: V23.2 security scan
        run: python -m bandit -q app/verifiable_general_agent_v232.py -lll
      - name: V23.2 release metadata and OpenAPI contract
        run: |
          python - <<'PYTHON'
          from app import PLATFORM_RELEASE
          from app.api import app
          assert PLATFORM_RELEASE == "23.2.0", PLATFORM_RELEASE
          paths = app.openapi()["paths"]
          required = {
              "/v23.2/general-agent/episodes",
              "/v23.2/general-agent/episodes/{agent_id}",
              "/v23.2/general-agent/goals",
              "/v23.2/general-agent/goals/id/{goal_id}",
              "/v23.2/general-agent/goals/{goal_id}/status",
              "/v23.2/general-agent/goals/{goal_id}/history",
              "/v23.2/general-agent/context/{agent_id}",
              "/v23.2/general-agent/world/simulate",
              "/v23.2/general-agent/cycle",
              "/v23.2/general-agent/receipts/agent/{agent_id}",
              "/v23.2/general-agent/receipts/{cycle_id}",
              "/v23.2/general-agent/receipts/{cycle_id}/verify",
          }
          missing = sorted(required - paths.keys())
          assert not missing, missing
          print("V23.2 OpenAPI contract passed")
          PYTHON
