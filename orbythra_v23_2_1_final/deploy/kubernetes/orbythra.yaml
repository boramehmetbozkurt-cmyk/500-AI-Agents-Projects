apiVersion: v1
kind: ConfigMap
metadata:
  name: orbythra-config
data:
  ORBYTHRA_ENV: production
  ORBYTHRA_KEY_MANAGEMENT_MODE: kms_envelope
  ORBYTHRA_RELEASE_SHA: REPLACE_AT_DEPLOY
  ORBYTHRA_DEPLOYMENT_ID: REPLACE_AT_DEPLOY
  ORBYTHRA_RATE_LIMIT_PER_MINUTE: "600"
  ORBYTHRA_MAX_BODY_BYTES: "2000000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbythra-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: orbythra-api
  template:
    metadata:
      labels:
        app: orbythra-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/REPLACE_OWNER/orbythra:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: orbythra-config
            - secretRef:
                name: orbythra-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orbythra-api
spec:
  selector:
    app: orbythra-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orbythra-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: orbythra-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbythra-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbythra-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orbythra-api
spec:
  podSelector:
    matchLabels:
      app: orbythra-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 5432
