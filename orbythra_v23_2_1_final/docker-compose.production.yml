services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbythra
      POSTGRES_USER: orbythra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - orbythra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbythra -d orbythra"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORBYTHRA_ENV: production
      ORBYTHRA_DATABASE_URL: postgresql+psycopg://orbythra:${POSTGRES_PASSWORD}@postgres:5432/orbythra
      ORBYTHRA_API_KEYS: ${ORBYTHRA_API_KEYS:-}
      ORBYTHRA_API_ROLES: ${ORBYTHRA_API_ROLES:-}
      ORBYTHRA_OIDC_ISSUER: ${ORBYTHRA_OIDC_ISSUER:-}
      ORBYTHRA_OIDC_AUDIENCE: ${ORBYTHRA_OIDC_AUDIENCE:-}
      ORBYTHRA_OIDC_JWKS_URL: ${ORBYTHRA_OIDC_JWKS_URL:-}
      ORBYTHRA_OIDC_JWKS_JSON: ${ORBYTHRA_OIDC_JWKS_JSON:-}
      ORBYTHRA_OIDC_WORKSPACE_CLAIM: ${ORBYTHRA_OIDC_WORKSPACE_CLAIM:-orbythra_workspace}
      ORBYTHRA_OIDC_ROLE_CLAIM: ${ORBYTHRA_OIDC_ROLE_CLAIM:-orbythra_role}
      ORBYTHRA_MASTER_KEYS: ${ORBYTHRA_MASTER_KEYS:?set ORBYTHRA_MASTER_KEYS}
      ORBYTHRA_SIGNING_KEYS: ${ORBYTHRA_SIGNING_KEYS:?set ORBYTHRA_SIGNING_KEYS}
      ORBYTHRA_CRYPTO_ALGORITHM: ${ORBYTHRA_CRYPTO_ALGORITHM:-aes256-gcm}
      ORBYTHRA_PQC_MODE: ${ORBYTHRA_PQC_MODE:-hybrid-required}
      ORBYTHRA_ALLOW_LEGACY_APPROVALS: "false"
      ORBYTHRA_KEY_MANAGEMENT_MODE: ${ORBYTHRA_KEY_MANAGEMENT_MODE:-environment}
      ORBYTHRA_RATE_LIMIT_PER_MINUTE: ${ORBYTHRA_RATE_LIMIT_PER_MINUTE:-120}
      ORBYTHRA_MAX_BODY_BYTES: ${ORBYTHRA_MAX_BODY_BYTES:-2000000}
      ORBYTHRA_RELEASE_SHA: ${ORBYTHRA_RELEASE_SHA:-}
      ORBYTHRA_DEFAULT_MODEL_ID: ${ORBYTHRA_DEFAULT_MODEL_ID:-default}
      ORBYTHRA_EVIDENCE_PROVIDER_URL: ${ORBYTHRA_EVIDENCE_PROVIDER_URL:-}
      ORBYTHRA_EVIDENCE_PROVIDER_TOKEN: ${ORBYTHRA_EVIDENCE_PROVIDER_TOKEN:-}
      ORBYTHRA_LLM_PROVIDER_URL: ${ORBYTHRA_LLM_PROVIDER_URL:-}
      ORBYTHRA_LLM_PROVIDER_TOKEN: ${ORBYTHRA_LLM_PROVIDER_TOKEN:-}
      ORBYTHRA_TRAINING_PROVIDER_URL: ${ORBYTHRA_TRAINING_PROVIDER_URL:-}
      ORBYTHRA_TRAINING_PROVIDER_TOKEN: ${ORBYTHRA_TRAINING_PROVIDER_TOKEN:-}
      ORBYTHRA_SKILL_SANDBOX_URL: ${ORBYTHRA_SKILL_SANDBOX_URL:-}
      ORBYTHRA_SKILL_SANDBOX_TOKEN: ${ORBYTHRA_SKILL_SANDBOX_TOKEN:-}
      ORBYTHRA_MULTIMODAL_ALLOWED_ADAPTERS: ${ORBYTHRA_MULTIMODAL_ALLOWED_ADAPTERS:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      SERPAPI_HL: ${SERPAPI_HL:-}
      SERPAPI_GL: ${SERPAPI_GL:-}
      SERPAPI_LOCATION: ${SERPAPI_LOCATION:-}
      GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
      GOOGLE_SEARCH_ENGINE_ID: ${GOOGLE_SEARCH_ENGINE_ID:-}
      ORBYTHRA_KEYLESS_SEARCH: ${ORBYTHRA_KEYLESS_SEARCH:-true}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ORBYTHRA_FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  orbythra-postgres:
