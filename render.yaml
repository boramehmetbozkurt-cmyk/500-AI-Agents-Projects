services:
  - type: web
    name: orbythra-demo
    runtime: static
    branch: orbythra-one-click-deploy
    rootDir: orbythra_live_demo
    buildCommand: echo "ORBYTHRA demo requires no build step"
    staticPublishPath: .
    autoDeployTrigger: off
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
