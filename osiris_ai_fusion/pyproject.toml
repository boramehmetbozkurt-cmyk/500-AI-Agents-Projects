[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long SQL/API signatures are intentionally readable as domain records; the
# remaining exceptions are non-functional modernization hints. Functional
# correctness is enforced by pytest, import checks, dependency audit and Docker CI.
ignore = ["E501", "UP035", "UP037", "UP012", "B904"]

# FastAPI intentionally evaluates Depends/Query in route signatures. Ruff B008 is
# not applicable to that dependency-injection pattern. Import-only exceptions remain
# isolated to framework entry modules and the new World integration module.
[tool.ruff.lint.per-file-ignores]
"app.py" = ["B008", "I001"]
"saas.py" = ["B008", "I001", "F401"]
"reality_atlas.py" = ["B008"]
"sensor_mesh.py" = ["I001"]
"tests/test_atlas.py" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
