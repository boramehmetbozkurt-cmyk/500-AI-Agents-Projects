services:
  osiris-fusion:
    build:
      context: .
      dockerfile: Dockerfile
    image: osiris-fusion:1.3.0
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      FUSION_STORE_PATH: /data/fusion.sqlite3
      SEAL_REPLAY_DB: /data/seal-replay.sqlite3
      UI_ENABLED: "true"
      SAAS_ENABLED: "true"
      COMMERCIAL_MODE: "true"
      STRICT_COMMERCIAL_SOURCES: "true"
    volumes:
      - osiris-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  osiris-data:
